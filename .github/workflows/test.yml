name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nginx nftables shellcheck python3
          sudo systemctl stop nginx || true
      - name: Lint, transcript tools, credential proxy
        run: bash tests/run-all.sh
      - name: Firewall reachability (network namespaces, needs root)
        run: sudo bash tests/test_firewall.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse agentlab.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/windows/agentlab.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          Write-Host 'agentlab.ps1 parses cleanly'
      - name: Time limit validation
        shell: pwsh
        run: |
          # Parameters bind before the script body runs, so a refused value never
          # reaches Hyper-V. A value that binds fails later, at the admin check or
          # at "run needs -Task", which is not a binding error.
          function Test-Binds([string]$time) {
            try { & ./windows/agentlab.ps1 run -Time $time *> $null; $true }
            catch { -not ($_.Exception -is [System.Management.Automation.ParameterBindingException]) }
          }
          $accepted = @('0', '0s', '00', '05m') | Where-Object { Test-Binds $_ }
          $refused = @('1', '30m', '2h', '5400s') | Where-Object { -not (Test-Binds $_) }
          if ($accepted -or $refused) {
            Write-Error "Accepted but should refuse: $accepted. Refused but should accept: $refused."
            exit 1
          }
          Write-Host 'agentlab.ps1 refuses a zero time limit'
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path windows/agentlab.ps1 -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions
          $issues | Format-Table -AutoSize | Out-String | Write-Host
          if ($issues | Where-Object Severity -eq 'Error') { exit 1 }
